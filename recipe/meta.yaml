{% set name = "numba-cuda" %}
{% set version = "0.30.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/NVIDIA/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c3ade7ffbe2efc766a15aa52af8eb0c6be2f1bac035bf524c86f62b1f2275d80

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [py<39 or osx]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - numpy {{ numpy }}
    - numpy
  run:
    - python
    - packaging
    - numpy >=1.22
    - numba >=0.60.0
    - cuda-bindings >=12.9.1,<14.0.0
    - cuda-core >=0.5.1,<2.0.0
    - cuda-pathfinder >=1.4.0,<2.0.0
    # Please see PKG-9812 for a discussion about the CUDA dependencies.
    - cuda-version >=12
    - cuda-nvcc-impl
    - cuda-cudart-dev
    - {{ pin_compatible('numpy') }}
  run_constrained:
    - cuda-bindings ==13.*
    - cuda-toolkit ==13.*
    - nvidia-nvjitlink-cu12 >=12.3.0,<13.0.0
    - nvidia-nvjitlink >=13.0.0,<14.0.0

test:
  requires:
    - pip
  imports:
    - numba_cuda
  commands:
    - pip check

about:
  home: https://github.com/NVIDIA/numba-cuda
  summary: A CUDA target for Numba
  description: |
    A Numba target for compiling Python code to excute on CUDA GPUs.
  license: BSD-2-Clause
  license_file: LICENSE
  license_family: BSD
  doc_url: https://nvidia.github.io/numba-cuda
  dev_url: https://github.com/NVIDIA/numba-cuda

extra:
  recipe-maintainers:
    - cbouss
